name: Test and deploy Worker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm run check
          npm test

      - name: Build Worker bundle
        run: npm run build

      - name: Validate Worker deployment
        run: npx wrangler deploy --dry-run

  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Worker bundle
        run: npm run build

      - name: Check deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VOLC_TTS_KEY: ${{ secrets.VOLC_TTS_KEY }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID VOLC_TTS_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            VOLC_TTS_KEY
        env:
          VOLC_TTS_KEY: ${{ secrets.VOLC_TTS_KEY }}
